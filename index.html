<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover neighborhood restaurants and explore locally available menus with QuickCrave."
    />
    <meta name="theme-color" content="#fffaf4" />
    <title>QuickCrave — Discover neighborhood food</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("quickcrave:theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
